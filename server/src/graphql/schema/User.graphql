enum UserStatus {
  ACTIVE
  INACTIVE
  EMAIL_VERIFICATION
}

type User {
  uuid: UUID!
  firstName: String!
  lastName: String!
  email: EmailAddress!
  status: UserStatus!
}

input RegisterUserInput {
  uuid: UUID!
  firstName: String!
  lastName: String!
  email: EmailAddress!
}

extend type Mutation {
  registerUser(input: RegisterUserInput!): User!
  verifyEmail(token: String!): User!
  resendVerificationEmail(email: EmailAddress!): Boolean!
}
