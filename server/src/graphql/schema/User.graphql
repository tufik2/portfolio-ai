enum UserStatus {
  ACTIVE
  INACTIVE
}

type User {
  uuid: ID!
  firstName: String!
  lastName: String!
  email: String!
  status: UserStatus!
}

input RegisterUserInput {
  "Generated by the client (crypto.randomUUID())."
  uuid: ID!
  firstName: String!
  lastName: String!
  email: String!
}

extend type Mutation {
  registerUser(input: RegisterUserInput!): User!
}
