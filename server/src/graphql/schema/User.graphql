enum UserStatus {
  ACTIVE
  INACTIVE
  EMAIL_VERIFICATION
}

type User {
  uuid: ID!
  firstName: String!
  lastName: String!
  email: String!
  status: UserStatus!
}

input RegisterUserInput {
  uuid: ID!
  firstName: String!
  lastName: String!
  email: String!
}

extend type Mutation {
  registerUser(input: RegisterUserInput!): User!
  verifyEmail(token: String!): User!
  resendVerificationEmail(email: String!): Boolean!
}
