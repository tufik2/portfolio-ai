enum UserStatus {
  ACTIVE
  INACTIVE
  EMAIL_VERIFICATION
}

type User {
  uuid: ID!
  firstName: String!
  lastName: String!
  email: String!
  status: UserStatus!
}

input RegisterUserInput {
  "Generated by the client (crypto.randomUUID())."
  uuid: ID!
  firstName: String!
  lastName: String!
  email: String!
}

extend type Mutation {
  registerUser(input: RegisterUserInput!): User!
  "Consumes the one-time token from the registration email and activates the user."
  verifyEmail(token: String!): User!
  "Sends a new verification link if the email belongs to a user waiting for verification. Always returns true."
  resendVerificationEmail(email: String!): Boolean!
}
